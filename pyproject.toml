[build-system]
# torch must match the runtime range below: build isolation resolves this list on its
# own, and a mismatch links the C++ extensions against the wrong libtorch.
# setuptools floor: 77 is the first release that understands the PEP 639 `license`
# SPDX string and `license-files` below.
requires = ["setuptools>=77", "torch>=2.11,<2.12", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen38-next-5090-lab"
# Single source of truth: python/freetoken/version.py (read via the attr directive below).
dynamic = ["version"]
description = "Experimental Qwen3.8-Flash-Next text-tower serving on one RTX 5090, downstream of FreeToken"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "MODIFICATIONS.md", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{ name = "FreeToken authors and Qwen3.8 Next 5090 Lab contributors" }]
maintainers = [
    { name = "wimi321", email = "34830250+wimi321@users.noreply.github.com" },
]
# No License:: classifier: setuptools>=77 rejects mixing one with the SPDX string above.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Version ranges are floor=last-verified, ceiling=next-major (kept loose enough to
# resolve, tight enough to bar a silent breaking bump). These ranges are the contract;
# there is no lockfile.
dependencies = [
    "apache-tvm-ffi==0.1.13.post3", # pin it
    "einops>=0.8,<1",
    "fastapi>=0.115,<1",
    # slot_cache: the device-side LRU admission kernel behind the MoE expert cache.
    "flashlib==0.3.0", # pin it
    "gguf>=0.19,<1",
    "huggingface_hub>=1.5,<2",
    "msgpack>=1.1,<2",
    "modelscope>=1.37,<2",
    # ceiling: numba (via flashlib) needs numpy<2.5
    "numpy>=2.0,<2.5",
    "openai>=2.0,<3",
    "partial-json-parser>=0.2,<1",
    "prompt_toolkit>=3.0,<4",
    "pydantic>=2.9,<3",
    "pyzmq>=27,<28",
    "safetensors>=0.6,<1",
    # floor+ceiling: sglang-kernel 0.4.5 links libtorch symbols only 2.11 has.
    # PyPI's torch 2.11.0 wheel is itself the cu130 build, so plain pip resolves
    # correctly from PyPI alone; uv additionally pins the index below.
    "torch>=2.11,<2.12",
    "tqdm>=4.66,<5",
    "transformers>=5.5,<6",
    "triton==3.6.0; platform_system == 'Linux'",
    "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/wimi321/qwen38-next-5090-lab"
Repository = "https://github.com/wimi321/qwen38-next-5090-lab"
Issues = "https://github.com/wimi321/qwen38-next-5090-lab/issues"
Upstream = "https://github.com/FlashML-org/FreeToken"
Documentation = "https://github.com/wimi321/qwen38-next-5090-lab#readme"

[project.scripts]
ft = "freetoken.cli:main"
q38lab = "q38lab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=6.0"]
# Native fused-kernel packages. Without them the runtime falls back to the pure-Triton
# kernels in freetoken.kernel.triton (and the 'triton' attention backend). Install
# `qwen38-next-5090-lab[accel]` for the full native fast path.
fi = ["flashinfer-python[cu13]>=0.6,<0.7"]
# renamed from sgl-kernel at 0.4; still imports as `sgl_kernel`, so never co-install both
sgl = ["sglang-kernel==0.4.5"]
accel = ["qwen38-next-5090-lab[fi,sgl]"]
# NOTE: the Marlin W4A16 NVFP4 expert-GEMM path (sm_80-99) borrows vLLM's AOT wheel
# (vllm>=0.14,<0.15), which pins transformers>=4.56,<5 and so is INCOMPATIBLE with the
# core transformers>=5.5 requirement. It is therefore not a lockable extra and is left
# out of the default resolution — install it separately (`pip install 'vllm>=0.14,<0.15'`)
# in a dedicated environment when you specifically need the Marlin path.

# uv-only provenance pins — pip ignores this section and resolves from PyPI.  The
# SGLang cu130 simple index currently advertises two hashes for the same x86_64
# release-asset URL, so uv correctly refuses the ambiguous registry result.  Pin the
# official GitHub v0.4.5 asset and GitHub-reported digest directly instead.  The
# platform marker keeps this WSL2/RTX-5090 source from affecting other platforms.
# `explicit = true` limits the PyTorch index to torch (that index also mirrors stale
# copies of common dependencies, which would otherwise shadow PyPI).
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
sglang-kernel = { url = "https://github.com/sgl-project/whl/releases/download/v0.4.5/sglang_kernel-0.4.5%2Bcu130-cp310-abi3-manylinux2014_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools]
include-package-data = true
package-dir = {"" = "python"}

[tool.setuptools.dynamic]
version = {attr = "freetoken.version.__version__"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"*" = ["csrc/**/*", "moe/configs/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: takes tens of seconds (big kernel sweeps, real-checkpoint reads); deselect with -m 'not slow'",
    "needs_weights: needs a real local checkpoint, gated behind an env var (see tests/README.md)",
]
